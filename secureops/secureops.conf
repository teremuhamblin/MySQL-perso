#######################################################################
# 🛡️ SecureOps v7.0 — CyberDefense Edition
# Durcissement, Zero-Trust, anti-scan, audit, multi-environnements
#######################################################################

############################
# 🌍 ENVIRONNEMENT
############################
# DEV / STAGING / PROD
environment=DEV

############################
# 🔐 ZERO-TRUST
############################
# Autorisation IP stricte
allow_ip=127.0.0.1
allow_ip_range=none
deny_all_external=true

############################
# 📚 MODES D’ACCÈS
############################
# Lecture seule (API publique)
readonly=false

# Désactivation des routes sensibles
disable_delete=true
disable_update=false
disable_insert=false

############################
# 🛡️ ANTI-SCAN / ANTI-ABUSE
############################
# Limite de requêtes par minute
rate_limit=25

# Blocage automatique après abus
auto_block=true
auto_block_threshold=100
auto_block_duration=300

# Protection brute-force
max_failed_attempts=5
lockout_time=120

############################
# 📡 AUDIT & TRAÇABILITÉ
############################
audit_enabled=true
audit_log_file=logs/secureops_audit.log
audit_level=FULL   # NONE / BASIC / FULL

############################
# 🔍 INTÉGRITÉ & TAMPER-PROOF
############################
config_checksum_sha256=true
config_signature_required=false

############################
# 🧱 API / PWA v4.0
############################
api_mode=strict
sanitize_inputs=true
sanitize_outputs=true

############################
# 🧩 MODULES
############################
module_notes=true
module_audit=true
module_secureops=true

#######################################################################
# FIN — SecureOps v7.0 CyberDefense Edition
#######################################################################
