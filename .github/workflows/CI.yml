name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SQL linter
        run: python -m pip install --upgrade sqlfluff

      - name: Validate SQL files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sql_files < <(find . -type f -name '*.sql' -print0)

          if ((${#sql_files[@]} == 0)); then
            echo "No SQL files found."
            exit 0
          fi

          echo "Validating ${#sql_files[@]} SQL file(s)..."
          sqlfluff lint --dialect mysql "${sql_files[@]}"

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

      - name: CI completed
        run: echo "CI completed successfully."
