name: MySQL-Perso CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Vérification simple des fichiers SQL (non vides)
      - name: Check SQL files
        run: |
          echo "🔍 Vérification des fichiers SQL..."
          for file in $(find . -name "*.sql"); do
            echo "➡️ Vérification : $file"
            if [ ! -s "$file" ]; then
              echo "❌ ERREUR : $file est vide."
              exit 1
            fi
          done
          echo "✔ SQL OK"

      # Vérification simple des fichiers JSON (non vides)
      - name: Check JSON files
        run: |
          echo "🔍 Vérification des fichiers JSON..."
          for file in $(find . -name "*.json"); do
            echo "➡️ Vérification : $file"
            if [ ! -s "$file" ]; then
              echo "❌ ERREUR : $file est vide."
              exit 1
            fi
          done
          echo "✔ JSON OK"

      # Vérification simple des fichiers Markdown (non vides)
      - name: Check Markdown files
        run: |
          echo "🔍 Vérification des fichiers Markdown..."
          for file in $(find . -name "*.md"); do
            echo "➡️ Vérification : $file"
            if [ ! -s "$file" ]; then
              echo "❌ ERREUR : $file est vide."
              exit 1
            fi
          done
          echo "✔ Markdown OK"

      - name: CI Completed
        run: echo "✔ CI MySQL-Perso terminé sans erreurs."
