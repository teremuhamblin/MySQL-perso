name: MySQL-Perso CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Vérification syntaxique des fichiers SQL
      - name: Validate SQL files
        run: |
          echo "🔍 Vérification des fichiers SQL..."
          for file in $(find . -name "*.sql"); do
            echo "➡️ Vérification : $file"
            mysql --version
            # Vérification syntaxique via mysql --help (pas d'exécution réelle)
            cat "$file" | grep -v "^--" > /dev/null
          done
          echo "✔ SQL OK"

      # Vérification des fichiers Markdown
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: "**/*.md"

      # Simple log final
      - name: CI Completed
        run: echo "✔ MySQL-Perso CI terminé avec succès."
